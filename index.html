<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F5F6FC">
    <meta
      name="description"
      content="Map your system, review STRIDE threats, and track mitigations with NexGuard."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="NexGuard — Threat modeling, without the complexity">
    <meta
      property="og:description"
      content="A clear, structured workspace for threat modeling and mitigation planning."
    >
    <title>NexGuard — Threat modeling, without the complexity</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #252747;
        background: #f5f6fc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-card {
        width: min(100%, 420px);
        padding: 36px;
        border: 1px solid #dde1f0;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(37 39 71 / 8%);
        text-align: center;
      }
      .boot-mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 16px;
        color: #fff;
        background: #7775e8;
        font-size: 24px;
        font-weight: 750;
      }
      .boot-card h1 { margin: 0 0 8px; font-size: 24px; }
      .boot-card p { margin: 0; color: #777d98; line-height: 1.6; }
      .boot-progress {
        height: 4px;
        overflow: hidden;
        margin-top: 24px;
        border-radius: 99px;
        background: #eceffc;
      }
      .boot-progress::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #7775e8;
        animation: boot-loading 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-loading { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <main class="boot-screen">
        <section class="boot-card" aria-label="Loading NexGuard">
          <div class="boot-mark" aria-hidden="true">N</div>
          <h1>NexGuard</h1>
          <p>Preparing your threat-modeling workspace…</p>
          <div class="boot-progress" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <p style="margin:0;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#252747">
        NexGuard needs JavaScript enabled to load its interactive workspace.
      </p>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
